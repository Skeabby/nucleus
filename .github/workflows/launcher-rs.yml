name: Launcher (Rust)

on:
  push:
    branches: [main]
    paths: ['launcher-rs/**']
  pull_request:
    paths: ['launcher-rs/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
        working-directory: launcher-rs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: launcher-rs
      - run: cargo test --workspace
        working-directory: launcher-rs
      # docs/scoreboard.md (Rust section) must match what cargo actually measures.
      - run: node tools/scoreboard.mjs --check rust
      - run: cargo build --release
        working-directory: launcher-rs
