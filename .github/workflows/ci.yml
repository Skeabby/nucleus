name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Advisory feed only: a fresh CVE in a transitive dependency must not
      # block every unrelated PR, so this reports without failing the run.
      - name: Audit (prod deps, non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run verify
      # docs/scoreboard.md must match what the code actually measures.
      - run: npm run scoreboard -- --check ts
      # The catalogue signer must still produce the Rust verifier's golden
      # vector: a drifted signer would publish a signature nobody accepts.
      - run: npm run check:signing
