name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # docs/scoreboard.md must match what the code actually measures.
      - run: npm run scoreboard -- --check ts
      # The catalogue signer must still produce the Rust verifier's golden
      # vector: a drifted signer would publish a signature nobody accepts.
      - run: npm run check:signing
