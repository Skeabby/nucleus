[package]
name = "nucleus-launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure data model and parsers for the Nucleus app suite (manifests, roadmap, catalog, installed index, status). No I/O."

[dependencies]
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2 = "0.10"
thiserror.workspace = true

# N1 - update trust. ring is already in the tree through ureq/rustls, so the
# Ed25519 primitive arrives without a new crate; base64 decodes the envelope.
ring = "0.17"
base64 = "0.22"
