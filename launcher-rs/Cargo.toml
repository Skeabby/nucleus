[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1-alpha"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.32", default-features = false, features = ["default_fonts"] }
thiserror = "2"

# Published binaries are built with `scripts/build-release.ps1`, which also maps
# the build machine's absolute paths (`--remap-path-prefix`) out of the binary.
# `strip` keeps the download small and drops the last local symbol table.
[profile.release]
strip = true