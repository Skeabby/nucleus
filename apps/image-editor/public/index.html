<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Editor — Nucleus</title>
    <link rel="stylesheet" href="/_kit/kit.css" />
    <link rel="stylesheet" href="/_kit/craft.css" />
    <style>
      /* App accent: the launcher's "image" category colour (#F472B6). */
      :root { --nk-app-accent: #f472b6; }
    </style>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- The stage is adopted by NucleusShell: menus, tool rail, options bar,
         panels, status bar and shortcuts all live in /_kit/shell.js. -->
    <main class="i-stage" id="stage">
      <div id="empty"></div>

      <div id="work" hidden>
        <canvas id="view"></canvas>

        <!-- Crop overlay: draw, move and resize a rectangle in source space. -->
        <div id="crop-overlay" hidden>
          <div id="crop-box">
            <span class="crop-handle" data-handle="nw"></span>
            <span class="crop-handle" data-handle="ne"></span>
            <span class="crop-handle" data-handle="sw"></span>
            <span class="crop-handle" data-handle="se"></span>
            <span class="crop-size" id="crop-size"></span>
          </div>
        </div>
      </div>
    </main>

    <input id="file-input" type="file" accept="image/*" hidden />
    <input id="project-input" type="file" accept=".json,application/json" hidden />

    <script src="/_kit/kit.js"></script>
    <script src="/_kit/shell.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
