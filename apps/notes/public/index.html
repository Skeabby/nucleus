<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes — Nucleus</title>
    <link rel="stylesheet" href="/_kit/kit.css" />
    <link rel="stylesheet" href="/_kit/craft.css" />
    <style>
      /* App accent: the launcher's "text" category colour (#8AB4F8). */
      :root { --nk-app-accent: #8ab4f8; }
    </style>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- The editor column is adopted by NucleusShell (menus, options bar,
         panels, status bar and shortcuts all live in /_kit/shell.js). -->
    <div class="n-work" id="workspace">
      <div id="empty"></div>

      <div class="n-depth" id="note-panel" hidden>
        <header class="n-head">
          <!-- The shell docks the proposal card here (brief #3 §4.2). -->
          <div id="review-slot"></div>

          <input class="n-title" id="title-input" type="text" placeholder="Note title" spellcheck="true" />
          <div class="n-lines">
            <button class="n-details__toggle" id="details-toggle" type="button" aria-expanded="false" aria-controls="details">
              Details
            </button>
            <span class="n-lines__spring"></span>
            <span class="n-updated" id="note-updated"></span>
          </div>

          <div class="n-details" id="details" hidden>
            <div class="n-details__grid">
              <span class="n-details__label">Created</span><span id="detail-created">—</span>
              <span class="n-details__label">Updated</span><span id="detail-updated">—</span>
              <span class="n-details__label">Notebook</span>
              <select class="n-bookselect" id="note-book" aria-label="Notebook"></select>
            </div>
            <div class="n-tagline">
              <div class="n-tagchips" id="note-tags"></div>
              <input class="n-taginput" id="tag-input" type="text" placeholder="+ tag" autocomplete="off" spellcheck="false" aria-label="Add a tag" />
            </div>
          </div>
        </header>

        <div class="n-body" id="n-body" data-mode="edit">
          <textarea class="n-editor" id="editor" placeholder="Write in Markdown…" spellcheck="true" aria-label="Note body"></textarea>
          <div class="n-preview" id="preview"></div>
        </div>
      </div>
    </div>

    <input id="project-input" type="file" accept=".json,application/json" hidden />

    <!-- Quick open (Ctrl+P) — stays outside the shell's frame. -->
    <div class="n-overlay" id="quick" hidden>
      <div class="n-quick" role="dialog" aria-label="Quick open">
        <input id="quick-input" type="text" placeholder="Jump to a note…" autocomplete="off" spellcheck="false" />
        <div class="n-quick__list" id="quick-list"></div>
      </div>
    </div>

    <script src="/_kit/kit.js"></script>
    <script src="/_kit/shell.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
