<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Workbench — Nucleus</title>
    <link rel="stylesheet" href="/_kit/kit.css" />
    <link rel="stylesheet" href="/_kit/craft.css" />
    <style>
      /* App accent: the launcher's "pdf" category colour (#E85A6C). */
      :root { --nk-app-accent: #e85a6c; }
    </style>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- The workspace is adopted by NucleusShell (menubar, options bar, panels,
         status bar and shortcuts all live in /_kit/shell.js). -->
    <div class="w-canvas" id="workspace">
      <div id="empty"></div>
      <div class="c-cardslist" id="grid" data-zoom="m" hidden role="listbox" aria-label="Pages" aria-multiselectable="true"></div>
    </div>

    <input accept="application/pdf,.pdf" id="file-input" multiple type="file" hidden />
    <input accept="application/json,.json" id="project-input" type="file" hidden />

    <!-- Page preview (Space / double-click) — stays outside the shell's frame. -->
    <div class="p-overlay" id="preview" hidden>
      <div aria-label="Page preview" class="p-sheet" role="dialog">
        <header class="p-sheet__bar">
          <span class="p-sheet__label" id="preview-label"></span>
          <span class="p-sheet__spring"></span>
          <button class="c-btn c-btn--icon" id="preview-prev" title="Previous page (←)" type="button">‹</button>
          <button class="c-btn c-btn--icon" id="preview-next" title="Next page (→)" type="button">›</button>
          <button class="c-btn c-btn--icon" id="preview-rot" title="Rotate right (Ctrl+R)" type="button">↻</button>
          <button class="c-btn c-btn--icon" id="preview-close" title="Close (Esc)" type="button">×</button>
        </header>
        <div class="p-sheet__body" id="preview-body"></div>
        <footer class="p-sheet__foot" id="preview-foot"></footer>
      </div>
    </div>

    <script src="/_kit/kit.js"></script>
    <script src="/_kit/shell.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
